name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # The spec is the contract the SDKs and MCP server generate from. If it
      # stops validating, every downstream client is silently wrong.
      - run: npx --yes @redocly/cli@latest lint spec/openapi.yaml

  gateway:
    name: Gateway build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --workspace gateway || npm install --workspace gateway
      - run: npx tsc --noEmit -p gateway/tsconfig.json
      # Proves the Worker still bundles for workerd — the x402 stack pulls in
      # packages that can regress on Node-builtin usage between releases.
      - run: npm --workspace gateway run build

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --workspace packages/mcp-server
      # Includes the opponent-supplied prompt-injection defences. A regression
      # here is a security regression, not a style one — keep it blocking.
      - run: npm --workspace packages/mcp-server run test

  pool-sim:
    name: Pool engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --workspace packages/pool-sim
      # Verifies the vendored engine matches its manifest, stays pure, and still
      # reproduces the golden vectors. A failure here means agents searching
      # locally would disagree with the server — the package's whole premise.
      - run: npm --workspace packages/pool-sim run test

  channel-manager:
    name: Channel manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --workspace packages/channel-manager
      # Money tests: claiming is the only step that moves funds, and the ceiling
      # is what bounds how much can move at once. Keep blocking.
      - run: npm --workspace packages/channel-manager run test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
