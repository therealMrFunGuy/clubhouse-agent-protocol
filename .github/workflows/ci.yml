name: CI

on:
  # Both names on purpose. The branch is currently `master` while every README
  # and SECURITY.md link assumes `/blob/main/`; triggering on only one meant the
  # gitleaks secret scan had never run on a push at all.
  push: { branches: [main, master] }
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # The spec is the contract the SDKs and MCP server generate from. If it
      # stops validating, every downstream client is silently wrong.
      - run: npx --yes @redocly/cli@latest lint spec/openapi.yaml

  gateway:
    name: Gateway build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --workspace gateway || npm install --workspace gateway
      - run: npx tsc --noEmit -p gateway/tsconfig.json
      # Proves the Worker still bundles for workerd — the x402 stack pulls in
      # packages that can regress on Node-builtin usage between releases.
      - run: npm --workspace gateway run build

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --workspace packages/mcp-server
      # Includes the opponent-supplied prompt-injection defences. A regression
      # here is a security regression, not a style one — keep it blocking.
      - run: npm --workspace packages/mcp-server run test

  pool-sim:
    name: Pool engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --workspace packages/pool-sim
      # Verifies the vendored engine matches its manifest, stays pure, and still
      # reproduces the golden vectors. A failure here means agents searching
      # locally would disagree with the server — the package's whole premise.
      - run: npm --workspace packages/pool-sim run test

  channel-manager:
    name: Channel manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --workspace packages/channel-manager
      # Money tests: claiming is the only step that moves funds, and the ceiling
      # is what bounds how much can move at once. Keep blocking.
      - run: npm --workspace packages/channel-manager run test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Run gitleaks DIRECTLY rather than through the action's default mode.
      #
      # The action scans incrementally — the diff of the triggering push. On this
      # repo that meant "1 commits scanned, ~739 bytes" and a green
      # "No leaks detected" badge covering one commit out of eighteen. A secret
      # committed before CI existed, or before this job was fixed, would never be
      # seen; and when a history rewrite invalidated its base ref the action
      # scanned ZERO bytes and still reported no leaks found.
      #
      # A scan that cannot fail is not a control. This scans the entire history
      # every run, so the badge means what a reader assumes it means.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --source /repo \
            --redact \
            --verbose \
            --log-opts=--all
